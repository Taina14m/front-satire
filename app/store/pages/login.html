<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satire - Login</title>
  <link rel="stylesheet" href="../../store/css/global.css">
  <link rel="stylesheet" href="../../store/css/login.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">
      <span>S</span><span>A</span><span>T</span><span>I</span><span>R</span><span>E</span>
    </h1>
    <nav class="header__nav">
      <button class="header__access-btn" id="access-toggle" aria-label="Acessibilidade" title="Acessibilidade">
        <img src="../../store/assets/contrast.svg" alt="" width="20" height="20">
      </button>
      <div class="access-menu" id="access-menu">
        <button class="access-menu__item" id="access-contrast">
          <img src="../../store/assets/contrast.svg" alt="" width="16" height="16">
          Alto contraste
        </button>
      </div>
    </nav>
  </header>

  <main class="main">
    <!-- Imagens decorativas -->
    <img src="../assets/deco-purple-scribble.svg" alt="" class="deco deco--top-left" aria-hidden="true">
    <img src="../assets/deco-yellow-spiral.svg" alt="" class="deco deco--top-right" aria-hidden="true">
    <img src="../assets/deco-yellow-blob.svg" alt="" class="deco deco--bottom-left" aria-hidden="true">
    <img src="../assets/deco-purple-strokes.svg" alt="" class="deco deco--bottom-right" aria-hidden="true">

    <!-- Login -->
    <div class="card">
      <div class="card__outer">
        <div class="card__inner">
          <div class="card__content">
            <h2 class="card__title">
              <span>L</span><span>O</span><span>G</span><span>I</span><span>N</span>
            </h2>
            <p class="card__subtitle">Bem-vindo(a) de volta!</p>

            <form class="form">
              <div class="form__group">
                <label for="email" class="form__label">E-mail</label>
                <input type="email" id="email" name="email" class="form__input">
              </div>

              <div class="form__group">
                <label for="senha" class="form__label">Senha</label>
                <input type="password" id="senha" name="senha" class="form__input">
              </div>

              <button type="submit" class="form__btn">Entrar</button>
            </form>

            <p class="card__footer">Ainda não tem uma conta? <a href="register.html" class="card__link">Cadastre-se</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/accessibility.js"></script>
  <script>
    document.querySelector('.form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();

      // Remove erro anterior
      document.querySelectorAll('.form__error').forEach(el => el.remove());
      document.querySelectorAll('.form__input--error').forEach(el => el.classList.remove('form__input--error'));

      let hasError = false;

      if (!email) {
        showError('email', 'Preencha o e-mail');
        hasError = true;
      }

      if (!senha) {
        showError('senha', 'Preencha a senha');
        hasError = true;
      }

      if (hasError) return;

      sessionStorage.setItem('logado', 'true');
      window.location.href = 'home.html';
    });

    function showError(fieldId, message) {
      const input = document.getElementById(fieldId);
      input.classList.add('form__input--error');
      const error = document.createElement('span');
      error.className = 'form__error';
      error.textContent = message;
      input.parentElement.appendChild(error);
    }
  </script>
</body>
</html>
