<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATIRE Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar" aria-label="Menu principal">
            <div class="sidebar-header">
                <h1>SATIRE Admin</h1>
                <span>Painel acadêmico</span>
            </div>

            <nav class="sidebar-nav">
                <button class="menu-item active" type="button" data-section="produtos">
                    <span class="material-symbols-outlined" aria-hidden="true">inventory_2</span>
                    Produtos
                </button>
                <button class="menu-item" type="button" data-section="usuarios">
                    <span class="material-symbols-outlined" aria-hidden="true">group</span>
                    Usuários
                </button>
                <button class="menu-item" type="button" data-section="pedidos">
                    <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
                    Pedidos
                </button>
                <button class="menu-item" type="button" data-section="categorias">
                    <span class="material-symbols-outlined" aria-hidden="true">category</span>
                    Categorias
                </button>
            </nav>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div>
                    <strong>Dashboard</strong>
                    <span>Administração do sistema SATIRE</span>
                </div>

                <div class="topbar-actions">
                    <button class="topbar-icon-button" type="button" aria-label="Abrir notificações">
                        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                    </button>
                    <button class="profile-button" type="button" aria-label="Abrir perfil do administrador">
                        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
                        <span>Admin</span>
                    </button>
                </div>
            </header>

            <main class="content">
                <div id="page-content"></div>
            </main>
        </div>
    </div>

    <div id="modal-container" aria-live="polite"></div>

    <div class="accessibility-toolkit">
        <button class="accessibility-button" type="button" aria-label="Abrir ferramentas de acessibilidade" aria-expanded="false">
            <span class="material-symbols-outlined" aria-hidden="true">construction</span>
        </button>

        <div class="accessibility-menu" hidden>
            <button type="button" data-action="increase-text">Aumentar texto</button>
            <button type="button" data-action="decrease-text">Diminuir texto</button>
            <button type="button" data-action="contrast">Alto contraste</button>
            <button type="button" data-action="dark-mode">Modo escuro</button>
            <button type="button" data-action="reset-accessibility">Restaurar padrão</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/toolkit.js"></script>
    <script src="script.js"></script>
</body>
</html>
