<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - SATIRE Admin</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <section class="page-section" data-page="pedidos">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <ol>
                <li>Home</li>
                <li>Pedidos</li>
            </ol>
        </nav>

        <div class="page-header">
            <div>
                <h2>Pedidos</h2>
                <p>Acompanhe os pedidos registrados e seus principais dados.</p>
            </div>
        </div>

        <div class="filters-bar">
            <div class="search-field">
                <label for="pesquisa-pedidos">Pesquisar pedidos</label>
                <input id="pesquisa-pedidos" type="search" placeholder="Buscar por ID ou cliente">
            </div>
        </div>

        <section class="table-card" aria-label="Tabela de pedidos">
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Data</th>
                        <th scope="col">Total</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="pedidos-tbody"></tbody>
            </table>

            <p class="empty-state" id="pedidos-empty">Nenhum pedido encontrado.</p>
        </section>
    </section>
</body>
</html>
