<div class="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="categoria-form-title">
        <header class="modal-header">
            <h2 id="categoria-form-title">Categoria</h2>
            <button class="modal-close" type="button" aria-label="Fechar modal">Fechar</button>
        </header>

        <form class="modal-form" id="categoria-form">
            <div class="form-group">
                <label for="categoria-nome">Nome</label>
                <input id="categoria-nome" name="nome" type="text" placeholder="Nome da categoria">
            </div>

            <div class="form-group">
                <label for="categoria-descricao">Descrição</label>
                <textarea id="categoria-descricao" name="descricao" rows="4" placeholder="Descrição da categoria"></textarea>
            </div>

            <div class="form-group">
                <label for="categoria-status">Status</label>
                <select id="categoria-status" name="status">
                    <option value="">Selecione</option>
                    <option value="ativa">Ativa</option>
                    <option value="inativa">Inativa</option>
                </select>
            </div>

            <footer class="modal-actions">
                <button class="secondary-button" type="button" data-close-modal>Cancelar</button>
                <button class="primary-button" type="submit">Salvar</button>
            </footer>
        </form>
    </section>
</div>
