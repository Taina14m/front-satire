<div class="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="categoria-delete-title">
        <header class="modal-header">
            <h2 id="categoria-delete-title">Excluir categoria</h2>
            <button class="modal-close" type="button" aria-label="Fechar modal">Fechar</button>
        </header>

        <div class="modal-body">
            <p>Tem certeza de que deseja excluir esta categoria?</p>
        </div>

        <footer class="modal-actions">
            <button class="secondary-button" type="button" data-close-modal>Cancelar</button>
            <button class="danger-button" type="button" data-confirm-delete>Excluir</button>
        </footer>
    </section>
</div>
